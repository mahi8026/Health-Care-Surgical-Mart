services:
  - type: web
    name: medical-pos-backend
    env: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: SHOP_DB_NAME
        value: shop_6a020466789ca874348b2557
      # SHOP_DB_NAME pins the single-tenant app database. Without it, every
      # auth/route call throws "No shop database configured" (see AGENTS.md).
      # Other environment variables are set in the Render Dashboard.
