# ============================================================
# Health Care Surgical Mart — CI/CD Pipeline
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Backend Tests
  # ──────────────────────────────────────────────────────────
  test:
    name: Backend Tests (118 tests)
    runs-on: ubuntu-latest

    services:
      mongodb:
        # NOTE: mongo:8 / mongo:latest (8.0.5+) crash on startup on Linux
        # kernel >= 6.19 (GH ubuntu-latest) due to the TCMalloc/rseq
        # incompatibility (see docker-library/mongo discussion #748).
        # 8.0.4 is the last release before the bad TCMalloc bump.
        image: mongo:8.0.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    env:
      NODE_ENV: test
      JWT_SECRET: test-secret-key-minimum-32-characters-long-for-ci
      MONGODB_URI: mongodb://localhost:27017/test
      FIREBASE_PROJECT_ID: test-project
      SENDGRID_API_KEY: SG.test_key_for_testing_purposes_only_minimum_length
      SENDGRID_FROM_EMAIL: test@example.com
      ENABLE_QUEUES: "false"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Verify MongoDB reachable from runner
        working-directory: server
        run: |
          node -e "
            const { MongoClient } = require('mongodb');
            (async () => {
              const t0 = Date.now();
              const client = new MongoClient(process.env.MONGODB_URI, {
                serverSelectionTimeoutMS: 8000,
              });
              try {
                await client.connect();
                console.log('MONGO_OK', 'connected in', Date.now() - t0, 'ms');
              } catch (err) {
                console.log('MONGO_FAIL', err.message);
                process.exit(1);
              } finally {
                await client.close().catch(() => {});
              }
            })();
          "

      - name: Run backend tests
        working-directory: server
        run: |
          npm run test:ci 2>&1 | tee jest-ci.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' jest-ci.log \
              | grep -E "^  ●|^    ●|✕|Expected value|Received array|toContain|to(Be|Equal|Match)\(|FAIL |Test Suites:|Tests: [0-9]" \
              | head -120 | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $status

      - name: Upload jest log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-ci-log
          path: server/jest-ci.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage/

  # ──────────────────────────────────────────────────────────
  # JOB 2: Deploy Backend to Render
  # ──────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set — skipping deploy"
            exit 0
          fi
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render deploy hook response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "::error::Render deploy hook failed with HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✅ Render deploy triggered successfully"

      - name: Wait for deploy to start
        run: sleep 10

      - name: Verify backend health
        run: |
          echo "Waiting for Render to deploy (up to 3 minutes)..."
          for i in $(seq 1 18); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 10 \
              "https://health-care-surgical-mart.onrender.com/health" || echo "000")
            echo "Attempt $i: HTTP $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Backend health check timed out — deploy may still be in progress"

  # ──────────────────────────────────────────────────────────
  # JOB 3: Deploy Frontend to Firebase Hosting
  # ──────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Firebase Hosting
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend (production)
        working-directory: client
        run: npm run build
        env:
          VITE_API_URL: https://health-care-surgical-mart.onrender.com/api
          VITE_FIREBASE_API_KEY: AIzaSyCGCOhLgDSooqfDzDKDfJhDjv0VaiauJrA
          VITE_FIREBASE_AUTH_DOMAIN: health-care-60ee6.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: health-care-60ee6
          VITE_FIREBASE_STORAGE_BUCKET: health-care-60ee6.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '650347403792'
          VITE_FIREBASE_APP_ID: 1:650347403792:web:d4ead8c6ce94991fbdc895
          VITE_APP_NAME: Health Care Surgical Mart
          VITE_APP_VERSION: '2.0.0'
          VITE_ENABLE_ANALYTICS: 'true'
          VITE_ENABLE_FILE_UPLOAD: 'true'
          VITE_SENTRY_DSN: https://29e52d27ea1bb0b011b8414e0976bc5b@o4511383549837312.ingest.de.sentry.io/4511383552131152

      - name: Deploy to Firebase Hosting (live channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: health-care-60ee6
