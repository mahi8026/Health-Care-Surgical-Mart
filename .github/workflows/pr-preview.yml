# ============================================================
# Health Care Surgical Mart — PR Preview Deployments
# ============================================================
# Deploys a temporary Firebase Hosting preview channel for
# every pull request targeting main.
#
# - Preview URL is posted as a PR comment automatically
# - Preview channel expires after 7 days
# - Tests must pass before preview is deployed
# ============================================================

name: PR Preview

on:
  pull_request:
    branches: [main]

# Cancel in-progress preview builds for the same PR
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: Run Tests (same as ci.yml — must pass before preview)
  # ──────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        # Same pin as ci.yml — mongo:8.0.5+ crash on ubuntu-latest Linux
        # kernels >= 6.19 (TCMalloc/rseq incompatibility)
        image: mongo:8.0.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run unit tests
        working-directory: server
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_key_for_ci_pipeline_at_least_32_chars
          MONGODB_URI: mongodb://localhost:27017/test_db
          DB_NAME: test_db
          SENDGRID_API_KEY: SG.test_key_for_ci_pipeline_only
          SENDGRID_FROM_EMAIL: test@example.com
          ENABLE_QUEUES: 'false'

  # ──────────────────────────────────────────────────────────
  # JOB 2: Build and deploy preview channel
  # ──────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy PR Preview → Firebase
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build frontend (preview — points to production API)
        working-directory: client
        run: npm run build
        env:
          # Preview uses production API so it tests against real data
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: health-care-60ee6.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: health-care-60ee6
          VITE_FIREBASE_STORAGE_BUCKET: health-care-60ee6.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '650347403792'
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_NAME: Health Care Surgical Mart (Preview)
          VITE_APP_VERSION: '2.0.0'
          VITE_ENABLE_ANALYTICS: 'false'
          VITE_ENABLE_FILE_UPLOAD: 'true'

      - name: Deploy to Firebase Hosting (preview channel)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # channelId: auto creates a unique channel per PR (e.g. pr-42)
          # and posts the preview URL as a PR comment automatically
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
          projectId: health-care-60ee6
